<svg viewBox="0 0 400 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <rect width="400" height="230" fill="#F8FAFC"/>
  <!-- simplified car side profile -->
  <path d="M40 155 L70 115 L140 95 L250 95 L310 125 L355 155 L355 170 L40 170 Z" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="100" cy="170" r="16" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="295" cy="170" r="16" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="150" y="103" width="80" height="35" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- callout 1: bonnet / chassis plate -->
  <circle cx="80" cy="135" r="5" fill="#1D4ED8"/>
  <line x1="80" y1="135" x2="80" y2="55" stroke="#1D4ED8" stroke-width="2"/>
  <text x="20" y="45" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold">Chassis plate</text>
  <text x="20" y="62" fill="#334155" font-family="sans-serif" font-size="12">(under the bonnet)</text>

  <!-- callout 2: engine bay -->
  <circle cx="150" cy="120" r="5" fill="#1D4ED8"/>
  <line x1="150" y1="120" x2="150" y2="192" stroke="#1D4ED8" stroke-width="2"/>
  <text x="105" y="210" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold">Engine bay</text>

  <!-- callout 3: registration document -->
  <rect x="280" y="35" width="80" height="45" rx="3" fill="white" stroke="#1D4ED8" stroke-width="2"/>
  <line x1="288" y1="48" x2="352" y2="48" stroke="#94A3B8" stroke-width="2"/>
  <line x1="288" y1="58" x2="352" y2="58" stroke="#94A3B8" stroke-width="2"/>
  <line x1="288" y1="68" x2="325" y2="68" stroke="#94A3B8" stroke-width="2"/>
  <text x="320" y="26" text-anchor="middle" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="bold">CR book /</text>
  <text x="320" y="97" text-anchor="middle" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="bold">revenue licence</text>
</svg>
