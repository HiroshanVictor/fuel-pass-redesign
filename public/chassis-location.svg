<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <rect width="400" height="220" fill="#F8FAFC"/>
  <!-- simplified car side profile -->
  <path d="M40 150 L70 110 L140 90 L260 90 L320 120 L360 150 L360 165 L40 165 Z" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="100" cy="165" r="16" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="300" cy="165" r="16" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="150" y="98" width="80" height="35" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- callout 1: bonnet / chassis plate -->
  <circle cx="80" cy="130" r="5" fill="#1D4ED8"/>
  <line x1="80" y1="130" x2="80" y2="55" stroke="#1D4ED8" stroke-width="2"/>
  <text x="20" y="45" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold">Chassis plate</text>
  <text x="20" y="62" fill="#334155" font-family="sans-serif" font-size="12">(under the bonnet)</text>

  <!-- callout 2: engine bay -->
  <circle cx="150" cy="115" r="5" fill="#1D4ED8"/>
  <line x1="150" y1="115" x2="150" y2="185" stroke="#1D4ED8" stroke-width="2"/>
  <text x="105" y="205" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold">Engine bay</text>

  <!-- callout 3: registration document -->
  <rect x="300" y="30" width="70" height="45" rx="3" fill="white" stroke="#1D4ED8" stroke-width="2"/>
  <line x1="308" y1="42" x2="362" y2="42" stroke="#94A3B8" stroke-width="2"/>
  <line x1="308" y1="52" x2="362" y2="52" stroke="#94A3B8" stroke-width="2"/>
  <line x1="308" y1="62" x2="340" y2="62" stroke="#94A3B8" stroke-width="2"/>
  <text x="290" y="20" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold">CR book / revenue licence</text>
</svg>
